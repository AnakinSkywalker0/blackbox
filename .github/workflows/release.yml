name: Release

# Push a version tag (for example v0.2.0) to build and publish a release.
# "Run workflow" from the Actions tab does a dry run: it builds and uploads the
# files as workflow artifacts, but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            exe: bb.exe
            bindir: target/release
            smoke: true
          - name: linux-x86_64
            os: ubuntu-latest
            exe: bb
            bindir: target/release
            smoke: true
          - name: macos-arm64
            os: macos-latest
            exe: bb
            bindir: target/release
            smoke: true
          # Built on the Apple Silicon runner. Tested natively by the arm64 job above, and
          # not run here (the runner may not have Rosetta).
          - name: macos-x86_64
            os: macos-latest
            exe: bb
            target: x86_64-apple-darwin
            bindir: target/x86_64-apple-darwin/release
            smoke: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' bb-cli/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match bb-cli/Cargo.toml version v$version"
            exit 1
          fi

      - name: Tests
        if: ${{ !matrix.target }}
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p bb-cli ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Package
        id: pack
        run: |
          version=$(grep -m1 '^version' bb-cli/Cargo.toml | cut -d'"' -f2)
          dir="bb-v${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp "${{ matrix.bindir }}/${{ matrix.exe }}" README.md LICENSE "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="$dir.zip"
            7z a -tzip "$asset" "$dir" > /dev/null
          else
            asset="$dir.tar.gz"
            tar czf "$asset" "$dir"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Smoke test the packaged binary
        if: matrix.smoke
        run: |
          dir="bb-v$(grep -m1 '^version' bb-cli/Cargo.toml | cut -d'"' -f2)-${{ matrix.name }}"
          "./$dir/${{ matrix.exe }}" --version
          "./$dir/${{ matrix.exe }}" bench --secs 3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path bb-cli/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" installer\blackbox.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $name = "bb-v$version-setup-x64.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist\$name.sha256" -Encoding ascii
          "INSTALLER_VERSION=$version" | Add-Content $env:GITHUB_ENV

      - name: Smoke test the installer (install, run, upgrade, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\bb-v$env:INSTALLER_VERSION-setup-x64.exe").Path
          $dir = "$env:LOCALAPPDATA\blackbox\bin"
          $bb = "$dir\bb.exe"
          $silent = '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          # 1. Fresh silent install under a harness that waits for the installer AND everything it
          #    started. Winget's validation works this way and reports "failed to install without
          #    user input" if anything is left running, so a fresh install must not start the recorder.
          $job = Start-Job -ScriptBlock { param($f, $a) Start-Process $f -ArgumentList $a -Wait } -ArgumentList $setup, $silent
          if (-not (Wait-Job $job -Timeout 120)) { throw "the installer left a background process running, so automated installers would wait forever" }
          Start-Sleep 2
          $said = (& $bb --version).Trim()
          if ($said -ne "bb $env:INSTALLER_VERSION") { throw "installed program says '$said'" }
          if (Get-Process bb -ErrorAction SilentlyContinue) { throw "a fresh silent install must not start the recorder" }
          if (-not (Get-ItemProperty $runKey).blackbox) { throw "start at login wasn't registered" }

          # 2. Recording works once started.
          & $bb start --quiet
          Start-Sleep 5
          & $bb status
          if (-not (Get-Process bb -ErrorAction SilentlyContinue)) { throw "the recorder didn't start" }

          # 3. Upgrading over a running recorder must bring the recorder back as a new process.
          $before = @((Get-Process bb).Id)
          $p = Start-Process $setup -ArgumentList $silent -PassThru
          if (-not $p.WaitForExit(120000)) { throw "the upgrade timed out" }
          if ($p.ExitCode -ne 0) { throw "the upgrade exited with code $($p.ExitCode)" }
          Start-Sleep 5
          $after = @((Get-Process bb -ErrorAction SilentlyContinue).Id)
          if ($after.Count -eq 0) { throw "the recorder wasn't restarted after an upgrade" }
          if ($before | Where-Object { $after -contains $_ }) { throw "expected a new recorder process after the upgrade" }

          # 4. Uninstalling stops the recorder and removes start at login.
          $un = Start-Process "$dir\unins000.exe" -ArgumentList $silent -PassThru
          if (-not $un.WaitForExit(120000)) { throw "the uninstaller timed out" }
          Start-Sleep 5
          if (Get-Process bb -ErrorAction SilentlyContinue) { throw "the recorder is still running after uninstall" }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).blackbox) { throw "start at login wasn't removed" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-installer
          path: |
            dist/bb-v*-setup-x64.exe
            dist/bb-v*-setup-x64.exe.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -l dist

      - name: Generate winget manifests
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/bb-v*-setup-x64.exe | Select-Object -First 1
          $version = ($setup.Name -replace '^bb-v(.+)-setup-x64\.exe$', '$1')
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          ./packaging/winget/generate.ps1 -Version $version -Sha256 $sha -OutDir winget-out

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget-out
          if-no-files-found: error
      # Fixed names (no version), so these links always give the newest release:
      #   https://github.com/AnakinSkywalker0/blackbox/releases/latest/download/bb-setup-x64.exe
      - name: Add fixed-name copies of each download
        run: |
          cd dist
          for f in bb-v*-setup-x64.exe bb-v*-windows-x86_64.zip bb-v*-linux-x86_64.tar.gz bb-v*-macos-arm64.tar.gz bb-v*-macos-x86_64.tar.gz; do
            [ -f "$f" ] || continue
            stable=$(echo "$f" | sed -E 's/^bb-v[0-9][^-]*-/bb-/')
            cp "$f" "$stable"
            sha256sum "$stable" > "$stable.sha256"
          done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install (Windows)

            Download **bb-v*-setup-x64.exe** below and run it. No admin rights needed. It puts `bb` on your PATH, starts recording in the background and starts it at every login. Then open a new terminal and run `bb status`.

            Windows may warn about an unknown publisher because the installer isn't code-signed yet: click **More info**, then **Run anyway**. You can check the download against its `.sha256` file.

            Uninstall from Windows Settings > Apps, or run `bb uninstall`. Your recorded data is kept.

            ## Install (Linux and macOS)

            ```
            curl -fsSL https://raw.githubusercontent.com/AnakinSkywalker0/blackbox/main/install.sh | sh
            ```

            Or download the `.tar.gz` for your system below, unpack it and run `./bb install`.

            ## Always the latest

            Windows: `https://github.com/AnakinSkywalker0/blackbox/releases/latest/download/bb-setup-x64.exe`

            Prefer a zip? The `windows-x86_64` zip contains `bb.exe`; run `bb.exe install`.
