<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blackbox GUI mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f4f4f2;--surface-1:#f8f8f6;--surface-2:#fff;--text-primary:#1a1a19;--text-secondary:#5f5e5a;--text-muted:#888780;
--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.18);--ghost-hover:rgba(0,0,0,.04);--ghost-sel:rgba(0,0,0,.08);
--bg-danger:#fcebeb;--text-danger:#a32d2d;--bg-warning:#faeeda;--text-warning:#854f0b;--text-success:#3b6d11;--fill-success:#639922;
--text-accent:#185fa5;--radius:8px}
@media (prefers-color-scheme:dark){:root{--surface-0:#141413;--surface-1:#1c1c1b;--surface-2:#222221;--text-primary:#ededea;--text-secondary:#b4b2a9;--text-muted:#888780;
--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.2);--ghost-hover:rgba(255,255,255,.06);--ghost-sel:rgba(255,255,255,.12);
--bg-danger:#501313;--text-danger:#f09595;--bg-warning:#412402;--text-warning:#fac775;--text-success:#97c459;--fill-success:#639922;--text-accent:#85b7eb}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
button{font:inherit;color:inherit;background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--ghost-hover)}
.bb{max-width:820px;margin:0 auto;display:grid;grid-template-columns:150px minmax(0,1fr);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2);font-size:14px;min-height:520px}
.side{background:var(--surface-1);border-right:0.5px solid var(--border);padding:14px 8px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border:none;color:var(--text-secondary);text-align:left;width:100%}
.nav:hover{background:var(--ghost-hover)}.nav.on{background:var(--ghost-sel);color:var(--text-primary)}
.main{padding:20px 22px}
.card{border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;margin-bottom:8px}
.card:hover{border-color:var(--border-strong)}
.chip{font-size:12px;padding:2px 8px;border-radius:var(--radius)}
.muted{color:var(--text-secondary);font-size:13px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.note{max-width:820px;margin:12px auto 0;font-size:12px;color:var(--text-muted)}
@media (max-width:560px){.bb{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:0.5px solid var(--border)}.nav{width:auto}}
</style>
</head>
<body>
<div class="bb">
  <div class="side">
    <div style="display:flex;align-items:center;gap:8px;padding:4px 10px 14px;font-weight:500"><i class="ti ti-box" aria-hidden="true" style="font-size:18px"></i>blackbox</div>
    <button class="nav on" data-v="home"><i class="ti ti-home" aria-hidden="true"></i>Home</button>
    <button class="nav" data-v="cpu"><i class="ti ti-cpu" aria-hidden="true"></i>CPU</button>
    <button class="nav" data-v="mem"><i class="ti ti-stack-2" aria-hidden="true"></i>Memory</button>
    <button class="nav" data-v="disk"><i class="ti ti-database" aria-hidden="true"></i>Disk</button>
    <button class="nav" data-v="heat"><i class="ti ti-temperature" aria-hidden="true"></i>Heat</button>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;color:var(--text-secondary)"><span style="width:7px;height:7px;border-radius:50%;background:var(--fill-success)"></span>Recording</div>
  </div>
  <div class="main" id="main"></div>
</div>
<p class="note">Design mockup for the bb-gui redesign. The first slowdown uses a real capture; the other two and the chart lines are made up.</p>
<template id="home">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
    <i class="ti ti-circle-check" aria-hidden="true" style="font-size:24px;color:var(--text-success)"></i>
    <div style="font-size:20px;font-weight:500">Running smoothly right now</div>
  </div>
  <div class="muted" style="margin:0 0 18px 36px">3 slowdowns in the last 24 hours, all explained</div>
  <div class="muted" style="margin-bottom:6px">Last 24 hours</div>
  <div id="strip" style="display:flex;gap:2px;height:28px;margin-bottom:4px"></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:20px"><span>Yesterday 04:00</span><span>16:00</span><span>Now</span></div>
  <div class="muted" style="margin-bottom:8px">Slowdowns</div>
  <div id="cards"></div>
</template>
<script>
const S=[
 {t:"03:14 to 03:16",dur:"2 min",title:"Running out of memory",sev:"high",slot:23,
  why:"Your RAM was 84 to 95% full, so Windows moved memory to disk. Everything waits on the disk when that happens.",
  ev:[["Memory used","86% average, 95% peak"],["Pagefile in use","20.7 GB"],["Written out to disk","up to 134 MB/s"],["Biggest user","claude.exe, 2.6 GB"]],
  fix:"Close apps you aren't using, or add RAM. 16 GB is tight for this workload."},
 {t:"Yesterday 21:40",dur:"6 s",title:"Short CPU spike",sev:"medium",slot:17,
  why:"Every core was busy for a few seconds. That's the stutter you felt.",
  ev:[["CPU","100% for 6 seconds"],["Busiest program","MsMpEng.exe (Windows Defender)"]],
  fix:"Add your project folders to Defender exclusions."},
 {t:"Yesterday 14:05",dur:"11 min",title:"Slowed down by heat",sev:"medium",slot:10,
  why:"The CPU got hot and lowered its speed to cool down.",
  ev:[["Temperature","91 C peak"],["CPU speed","58% of maximum while busy"]],
  fix:"Use the laptop on a hard surface and clean the vents."}];
const tone=s=>s=="high"?["var(--bg-danger)","var(--text-danger)","Likely"]:["var(--bg-warning)","var(--text-warning)","Possible"];
const main=document.getElementById("main");
function drawHome(){
 main.innerHTML=document.getElementById("home").innerHTML;
 const strip=document.getElementById("strip");
 for(let i=0;i<24;i++){const s=S.find(x=>x.slot==i);const d=document.createElement("div");
  d.style.cssText="flex:1;border-radius:3px;background:"+(s?tone(s.sev)[0]:"var(--surface-1)")+(s?";cursor:pointer;border:0.5px solid "+tone(s.sev)[1]:"");
  if(s){d.title=s.title;d.onclick=()=>detail(s)}strip.appendChild(d)}
 const c=document.getElementById("cards");
 S.forEach(s=>{const [bg,fg,l]=tone(s.sev);const e=document.createElement("div");e.className="card";
  e.innerHTML=`<div style="flex:1"><div style="font-weight:500">${s.title}</div><div class="muted">${s.t} · ${s.dur}</div></div><span class="chip" style="background:${bg};color:${fg}">${l}</span><i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--text-muted)"></i>`;
  e.onclick=()=>detail(s);c.appendChild(e)})}
function detail(s){const [bg,fg,l]=tone(s.sev);
 main.innerHTML=`<button id="back" style="margin-bottom:16px"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
 <div class="muted">${s.t} · ${s.dur}</div>
 <div style="display:flex;align-items:center;gap:10px;margin:4px 0 8px"><div style="font-size:20px;font-weight:500">${s.title}</div><span class="chip" style="background:${bg};color:${fg}">${l} cause</span></div>
 <p style="margin:0 0 16px;color:var(--text-secondary);line-height:1.6">${s.why}</p>
 <div class="muted" style="margin-bottom:2px">Evidence</div>
 ${s.ev.map(([k,v])=>`<div class="row"><span style="color:var(--text-secondary)">${k}</span><span>${v}</span></div>`).join("")}
 <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 14px;margin:16px 0;display:flex;gap:10px"><i class="ti ti-bulb" aria-hidden="true" style="font-size:18px;color:var(--text-accent)"></i><span>${s.fix}</span></div>
 <div style="display:flex;align-items:center;gap:8px"><span class="muted" style="margin-right:4px">Was this right?</span><button class="fb">Yes</button><button class="fb">Partly</button><button class="fb">No</button></div>`;
 document.getElementById("back").onclick=drawHome;
 main.querySelectorAll(".fb").forEach(b=>b.onclick=()=>{b.parentElement.innerHTML='<span class="muted"><i class="ti ti-check" aria-hidden="true"></i> Thanks. Saved on this computer only.</span>'})}
const R={cpu:["CPU","18%",30,"var(--text-accent)"],mem:["Memory","84% used",85,"var(--text-success)"],disk:["Disk","2 MB/s",8,"var(--text-warning)"],heat:["Heat","64 C",64,"var(--text-danger)"]};
function chart(k){const [name,now,base,col]=R[k];let p=[];for(let i=0;i<=60;i++){let v=base+Math.sin(i/4)*6+(Math.random()-.5)*8;if(k=="mem"&&i>44&&i<50)v=95;if(k=="cpu"&&i>44&&i<47)v=94;p.push(Math.max(2,Math.min(98,v)))}
 const pts=p.map((v,i)=>`${i*10},${150-v*1.4}`).join(" ");
 main.innerHTML=`<div class="muted">${name} now</div><div style="font-size:28px;font-weight:500;margin-bottom:14px">${now}</div>
 <svg viewBox="0 0 600 150" style="width:100%;height:170px" role="img" aria-label="${name} over the last hour"><rect x="440" y="0" width="60" height="150" style="fill:var(--bg-danger);cursor:pointer"/><polyline points="${pts}" fill="none" stroke-width="2" style="stroke:${col}"/></svg>
 <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)"><span>1 hour ago</span><span>Now</span></div>
 <div class="muted" style="margin-top:14px">Shaded: the memory slowdown at 03:14. Click it to see why.</div>`;
 main.querySelector("rect").onclick=()=>detail(S[0])}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));n.classList.add("on");n.dataset.v=="home"?drawHome():chart(n.dataset.v)});
drawHome();
</script>
</body>
</html>
