[package]
name = "bb-gui"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "Desktop window for blackbox: timeline charts and plain-English explanations"

[[bin]]
name = "bb-gui"
path = "src/main.rs"

[dependencies]
bb-core = { path = "../bb-core" }
chrono = "0.4.45"
eframe = "0.36.2"
egui_plot = "0.37.0"
sysinfo = "0.39.6"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
